
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Topographic Dream</title>
    <style>
        :root {
            --paper: #f2efe7;
            --ink: #292a26;
            --glass: rgba(242,239,231,.76);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--paper);
        }

        body {
            color: var(--ink);
            font-family: monospace;
        }

        #art {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: var(--paper);
        }

        #toolbar {
            position: fixed;
            z-index: 5;
            top: 14px;
            left: 14px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        button {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid #292a2630;
            border-radius: 3px;
            background: var(--glass);
            color: var(--ink);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            font: 18px/1 monospace;
            transition: background .18s, border-color .18s;
        }

            button:hover, button:focus-visible {
                background: #fffdf7;
                border-color: #292a2670;
                outline: none;
            }

            button:active {
                transform: scale(.96);
            }

        #menu {
            position: fixed;
            z-index: 6;
            top: 60px;
            left: 14px;
            width: min(290px, calc(100vw - 28px));
            padding: 17px;
            border: 1px solid #292a2625;
            border-radius: 4px;
            background: rgba(242,239,231,.91);
            box-shadow: 0 12px 40px #292a2610;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: none;
        }

            #menu.open {
                display: block;
            }

        .menu-title {
            margin-bottom: 18px;
            font-size: 10px;
            letter-spacing: .18em;
            opacity: .65;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 10px;
            letter-spacing: .12em;
            opacity: .7;
        }

        input {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #292a2630;
            border-radius: 2px;
            background: #ffffff55;
            color: var(--ink);
            font: 12px monospace;
            outline: none;
        }

            input:focus {
                border-color: #292a2690;
            }

        .menu-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

            .menu-actions button {
                width: 100%;
                height: 36px;
                font-size: 10px;
                letter-spacing: .06em;
            }

        #status {
            position: fixed;
            right: 14px;
            bottom: 14px;
            z-index: 3;
            padding: 7px 9px;
            border: 1px solid #292a2618;
            border-radius: 2px;
            background: var(--glass);
            color: #292a26a0;
            font-size: 9px;
            letter-spacing: .1em;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        @media (max-width: 480px) {
            #toolbar {
                top: 10px;
                left: 10px;
                gap: 5px;
            }

            button {
                width: 36px;
                height: 36px;
            }

            #menu {
                top: 54px;
                left: 10px;
            }

            #status {
                right: 10px;
                bottom: 10px;
                font-size: 8px;
            }
        }
    </style>
</head>
<body>
    <svg id="art" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"
         aria-label="Infinite monochrome topographic landscape">
        <rect width="1000" height="700" fill="#f2efe7" />
    </svg>

    <div id="toolbar">
        <button id="slower" title="Slow down" aria-label="Slow down">−</button>
        <button id="faster" title="Speed up" aria-label="Speed up">+</button>
        <button id="menuButton" title="Open settings" aria-label="Open settings">☰</button>
    </div>

    <aside id="menu" aria-label="Generator settings">
        <div class="menu-title">TOPOGRAPHIC DREAM</div>
        <label for="seed">GENERATION SEED</label>
        <input id="seed" value="481516" maxlength="32" autocomplete="off" spellcheck="false">
        <div class="menu-actions">
            <button id="generate">REGENERATE ↗</button>
            <button id="randomize">NEW SEED ⤨</button>
            <button id="exportSvg">EXPORT SVG ↓</button>
            <button id="exportPng">EXPORT PNG ↓</button>
        </div>
    </aside>

    <div id="status">CONTINUOUS TERRAIN · 1.0×</div>

    <script>
        (() => {
            "use strict";

            const NS = "http://www.w3.org/2000/svg";
            const W = 1000, H = 700;
            const COLS = 150, ROWS = 105;
            const LEVELS = 36, LIMIT = 200;
            const art = document.querySelector("#art");
            const seedInput = document.querySelector("#seed");
            const menu = document.querySelector("#menu");
            const status = document.querySelector("#status");

            let speed = 1;
            let paused = false;
            let currentSeed = "481516";
            let animationFrame = 0;
            let lastTime = 0;
            let offset = 0;
            let tileWidth = W;
            let mapGroup = null;

            function rngFrom(text) {
                let h = 2166136261;
                for (const c of text) {
                    h ^= c.charCodeAt(0);
                    h = Math.imul(h, 16777619);
                }
                return () => {
                    h += 0x6D2B79F5;
                    let t = h;
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function svgEl(tag, attrs = {}) {
                const node = document.createElementNS(NS, tag);
                for (const [key, value] of Object.entries(attrs)) {
                    node.setAttribute(key, value);
                }
                return node;
            }

            function makeLandscape(seed) {
                const rand = rngFrom(seed);
                const hills = Array.from({ length: 25 }, () => ({
                    x: rand(),
                    y: rand() * 1.35 - .175,
                    sx: .018 + rand() * .11,
                    sy: .025 + rand() * .14,
                    amp: (rand() < .25 ? -1 : 1) * (.45 + rand() * 1.65)
                }));

                function elevation(x, y) {
                    let z = 0;
                    for (const hill of hills) {
                        let d = Math.abs(x - hill.x);
                        d = Math.min(d, 1 - d);
                        const a = d / hill.sx;
                        const b = (y - hill.y) / hill.sy;
                        z += hill.amp * Math.exp(-.5 * (a * a + b * b));
                    }
                    z += .12 * Math.sin(2 * Math.PI * (4 * x + .6 * y));
                    z += .08 * Math.cos(2 * Math.PI * (3 * x - 2 * y));
                    z += .045 * Math.sin(2 * Math.PI * (9 * x + 4 * y));
                    z += .025 * Math.cos(2 * Math.PI * (13 * x - 7 * y));
                    return z;
                }

                const field = Array.from({ length: ROWS + 1 }, (_, j) =>
                    Float64Array.from({ length: COLS + 1 }, (_, i) =>
                        elevation(i / COLS, j / ROWS)
                    )
                );

                let min = Infinity, max = -Infinity;
                for (const row of field) {
                    for (const value of row) {
                        min = Math.min(min, value);
                        max = Math.max(max, value);
                    }
                }

                const step = (max - min) / (LEVELS + 1);
                const contours = [];

                for (let k = 1; k <= LEVELS; k++) {
                    const level = min + step * k;
                    let d = "";

                    function cross(x1, y1, v1, x2, y2, v2) {
                        const t = (level - v1) / (v2 - v1);
                        return [
                            ((x1 + (x2 - x1) * t) * W / COLS).toFixed(2),
                            ((y1 + (y2 - y1) * t) * H / ROWS).toFixed(2)
                        ];
                    }

                    for (let j = 0; j < ROWS; j++) {
                        for (let i = 0; i < COLS; i++) {
                            const v = [
                                field[j][i], field[j][i + 1],
                                field[j + 1][i + 1], field[j + 1][i]
                            ];
                            const p = [[i, j], [i + 1, j], [i + 1, j + 1], [i, j + 1]];
                            const hits = [];

                            for (let e = 0; e < 4; e++) {
                                const n = (e + 1) % 4;
                                if ((v[e] < level) !== (v[n] < level)) {
                                    hits.push(cross(
                                        p[e][0], p[e][1], v[e],
                                        p[n][0], p[n][1], v[n]
                                    ));
                                }
                            }

                            if (hits.length === 2) {
                                d += `M${hits[0][0]} ${hits[0][1]}L${hits[1][0]} ${hits[1][1]}`;
                            } else if (hits.length === 4) {
                                const center = (v[0] + v[1] + v[2] + v[3]) / 4;
                                const pairs = center < level
                                    ? [[0, 1], [2, 3]]
                                    : [[0, 3], [1, 2]];
                                for (const [a, b] of pairs) {
                                    d += `M${hits[a][0]} ${hits[a][1]}L${hits[b][0]} ${hits[b][1]}`;
                                }
                            }
                        }
                    }

                    if (d) contours.push({
                        d,
                        width: k % 6 === 0 ? 1.2 : .65,
                        opacity: k % 6 === 0 ? .95 : .72
                    });
                }

                return contours;
            }

            function render() {
                currentSeed = seedInput.value.trim() || "481516";
                seedInput.value = currentSeed;

                const contours = makeLandscape(currentSeed);
                art.replaceChildren();
                art.appendChild(svgEl("rect", {
                    width: W, height: H, fill: "#f2efe7"
                }));

                // One set of paths per tile; no more than 200 rendered SVG elements.
                const defs = svgEl("defs");
                const pattern = svgEl("pattern", {
                    id: "terrainTile",
                    patternUnits: "userSpaceOnUse",
                    width: W,
                    height: H
                });

                for (const c of contours.slice(0, LIMIT - 3)) {
                    pattern.appendChild(svgEl("path", {
                        d: c.d,
                        fill: "none",
                        stroke: "#292a26",
                        "stroke-width": c.width,
                        "stroke-opacity": c.opacity,
                        "stroke-linecap": "round",
                        "stroke-linejoin": "round"
                    }));
                }

                defs.appendChild(pattern);
                art.appendChild(defs);

                mapGroup = svgEl("g");
                mapGroup.appendChild(svgEl("rect", {
                    x: -W, y: 0, width: W * 4, height: H,
                    fill: "url(#terrainTile)"
                }));
                art.appendChild(mapGroup);

                tileWidth = W;
                offset = 0;
                lastTime = 0;
                status.textContent = `CONTINUOUS TERRAIN · ${speed.toFixed(1)}×`;

                // Background + defs + group + tile rectangle + contour paths <= 200.
                const count = art.querySelectorAll("*").length;
                if (count > LIMIT) {
                    const paths = pattern.querySelectorAll("path");
                    while (art.querySelectorAll("*").length > LIMIT && paths.length) {
                        paths[paths.length - 1].remove();
                    }
                }
            }

            function animate(time) {
                if (!paused && mapGroup) {
                    if (lastTime) {
                        const delta = Math.min(time - lastTime, 50);
                        offset -= delta * .018 * speed;
                        offset %= tileWidth;
                        if (offset > 0) offset -= tileWidth;
                        mapGroup.setAttribute("transform", `translate(${offset} 0)`);
                    }
                    lastTime = time;
                } else {
                    lastTime = 0;
                }
                animationFrame = requestAnimationFrame(animate);
            }

            function setSpeed(next) {
                speed = Math.max(.1, Math.min(8, next));
                status.textContent = `${paused ? "PAUSED" : "CONTINUOUS TERRAIN"} · ${speed.toFixed(1)}×`;
            }

            function exportFile(type) {
                const clone = art.cloneNode(true);
                clone.setAttribute("xmlns", NS);
                clone.setAttribute("width", W);
                clone.setAttribute("height", H);

                // Export a still, with the same seeded terrain and no moving transform.
                const group = clone.querySelector("g");
                if (group) group.removeAttribute("transform");

                const source = new XMLSerializer().serializeToString(clone);
                const svgBlob = new Blob([source], {
                    type: "image/svg+xml;charset=utf-8"
                });

                if (type === "svg") {
                    download(svgBlob, `topographic-dream-${safeName()}.svg`);
                    return;
                }

                const url = URL.createObjectURL(svgBlob);
                const img = new Image();

                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = W * 2;
                    canvas.height = H * 2;
                    const ctx = canvas.getContext("2d");
                    ctx.fillStyle = "#f2efe7";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.toBlob(blob => {
                        if (blob) download(blob, `topographic-dream-${safeName()}.png`);
                        URL.revokeObjectURL(url);
                    }, "image/png");
                };

                img.onerror = () => URL.revokeObjectURL(url);
                img.src = url;
            }

            function safeName() {
                return currentSeed.replace(/[^\w-]/g, "_") || "481516";
            }

            function download(blob, filename) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            document.querySelector("#slower").addEventListener("click", () => setSpeed(speed / 1.5));
            document.querySelector("#faster").addEventListener("click", () => setSpeed(speed * 1.5));

            document.querySelector("#menuButton").addEventListener("click", () => {
                menu.classList.toggle("open");
            });

            document.querySelector("#generate").addEventListener("click", render);
            document.querySelector("#randomize").addEventListener("click", () => {
                seedInput.value = Math.random().toString(36).slice(2, 10).toUpperCase();
                render();
            });

            document.querySelector("#exportSvg").addEventListener("click", () => exportFile("svg"));
            document.querySelector("#exportPng").addEventListener("click", () => exportFile("png"));

            seedInput.addEventListener("keydown", event => {
                if (event.key === "Enter") render();
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") menu.classList.remove("open");
                if (event.key === "ArrowUp") setSpeed(speed * 1.5);
                if (event.key === "ArrowDown") setSpeed(speed / 1.5);
            });

            render();
            animationFrame = requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
